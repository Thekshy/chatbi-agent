[project]
name = "chatbi"
version = "0.1.0"
description = "垂类电商数据分析 Agent（ChatBI）：LangGraph Plan-Execute + PostgreSQL 只读查询"
readme = "README.md"
authors = [
    { name = "YeJieKai", email = "15988096971@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "openai>=3.14.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlglot>=30.18.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实环境的用例（本机 PG mock 数据 / 智谱 API key，缺失自动 skip）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
