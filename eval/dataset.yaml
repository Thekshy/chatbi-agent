- id: dr001
  question: 面部精华 6 月 GMV 为何环比下滑，流量和转化各贡献多少
  type: drilldown
  standard_sql: |
    WITH g AS (
      SELECT (SUM(oi.unit_price * oi.quantity)
              FILTER (WHERE o.paid_at >= DATE '2026-06-01' AND o.paid_at < DATE '2026-07-01'))::float AS cur,
             (SUM(oi.unit_price * oi.quantity)
              FILTER (WHERE o.paid_at >= DATE '2026-05-01' AND o.paid_at < DATE '2026-06-01'))::float AS prev
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN products p ON p.product_id = oi.product_id
      WHERE o.status IN ('paid', 'shipped', 'completed')
        AND o.paid_at >= DATE '2026-05-01' AND o.paid_at < DATE '2026-07-01'
        AND p.category_l1 = '护肤' AND p.category_l2 = '面部精华'),
    u AS (
      SELECT (SUM(uv) FILTER (WHERE "date" >= DATE '2026-06-01' AND "date" < DATE '2026-07-01'))::float AS cur,
             (SUM(uv) FILTER (WHERE "date" >= DATE '2026-05-01' AND "date" < DATE '2026-06-01'))::float AS prev
      FROM traffic_daily
      WHERE category_l1 = '护肤'
        AND "date" >= DATE '2026-05-01' AND "date" < DATE '2026-07-01')
    SELECT ((g.cur - g.prev) / g.prev)::float AS gmv_change,
           ((u.cur - u.prev) / u.prev)::float AS uv_change,
           (((g.cur / u.cur) - (g.prev / u.prev)) / NULLIF(g.prev / u.prev, 0))::float AS yield_change
    FROM g, u
  expected:
