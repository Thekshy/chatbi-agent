  - get_schema
  - text2sql
  - validate_sql
  - run_query
  - decompose
  - report
  notes: §5.3 分解口径：GMV 环比 = (1+UV 环比)×(1+单位 UV 产出环比)−1；UV 取护肤 l1 （traffic_daily 无 l2），单位 UV 产出 = 面部精华
