- id: dr012
  question: 618 大促带来了多少新客复购增量
  type: drilldown
  standard_sql: |
    WITH paid AS (
      SELECT user_id, paid_at FROM orders
      WHERE status IN ('paid', 'shipped', 'completed')),
    first_order AS (
      SELECT user_id, MIN(paid_at) AS fp FROM paid GROUP BY user_id),
    new_users AS (
      SELECT user_id, fp,
             CASE WHEN fp >= DATE '2026-05-31' AND fp < DATE '2026-06-19' THEN 'act'
                  WHEN fp >= DATE '2026-05-01' AND fp < DATE '2026-05-31' THEN 'base' END AS grp
      FROM first_order),
    repeaters AS (
      SELECT DISTINCT n.user_id, n.grp FROM new_users n
      JOIN paid ON paid.user_id = n.user_id
       AND paid.paid_at > n.fp AND paid.paid_at <= n.fp + interval '30 days'),
    agg AS (
      SELECT n.grp, count(*)::float AS n_users, count(r.user_id)::float AS n_repeat
      FROM new_users n
      LEFT JOIN repeaters r ON r.user_id = n.user_id AND r.grp = n.grp
      GROUP BY 1)
    SELECT ((max(n_repeat) FILTER (WHERE grp = 'act') / max(n_users) FILTER (WHERE grp = 'act'))
          - (max(n_repeat) FILTER (WHERE grp = 'base') / max(n_users) FILTER (WHERE grp = 'base')))::float AS diff_pp,
           (max(n_repeat) FILTER (WHERE grp = 'act') / max(n_users) FILTER (WHERE grp = 'act'))::float AS rate_activity,
           (max(n_repeat) FILTER (WHERE grp = 'base') / max(n_users) FILTER (WHERE grp = 'base'))::float AS rate_baseline,
           (max(n_users) FILTER (WHERE grp = 'act'))::int AS n_activity,
           (max(n_users) FILTER (WHERE grp = 'base'))::int AS n_baseline
    FROM agg
  expected:
    value: 0.069739
    direction: up
    extras:
      rate_activity: 0.179505
      rate_baseline: 0.109765
      n_activity: 1454
      n_baseline: 1321
    tolerance: 0.02
  value_desc: 复购率差（小数，0.07 即 +7pp）；extras 含两期复购率与样本量
  expected_path:
  - plan
  - get_schema
  - text2sql
  - validate_sql
  - run_query
  - decompose
  - report
  notes: §5.2 活动复购增量：活动期新客（首单 paid_at ∈ [2026-05-31, 2026-06-19)）30 日复购率 − 基线期新客（[2026-05-01, 2026-05-31)，即活动前
    30 天）30 日复购率；SPEC §5.3 预期约 +6.97pp。
