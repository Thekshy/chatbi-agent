- id: sm015
  question: 2026 年 5 月新客的 30 日复购率是多少
  type: single_metric
  standard_sql: |
    WITH paid AS (
      SELECT user_id, paid_at FROM orders
      WHERE status IN ('paid', 'shipped', 'completed')),
    first_order AS (
      SELECT user_id, MIN(paid_at) AS fp FROM paid GROUP BY user_id),
    new_users AS (
      SELECT user_id, fp FROM first_order
      WHERE fp >= DATE '2026-05-01' AND fp < DATE '2026-06-01'),
    repeaters AS (
      SELECT DISTINCT n.user_id FROM new_users n
      JOIN paid ON paid.user_id = n.user_id
       AND paid.paid_at > n.fp AND paid.paid_at <= n.fp + interval '30 days')
    SELECT ((SELECT count(*) FROM repeaters)::float
            / NULLIF((SELECT count(*) FROM new_users), 0))::float AS repeat_rate,
           (SELECT count(*) FROM new_users)::int AS new_users,
           (SELECT count(*) FROM repeaters)::int AS repeaters
  expected:
    value: 0.113019
    direction: none
    extras:
      new_users: 1398
      repeaters: 158
    tolerance: 0.02
  value_desc: 2026-05 首单新客的 30 日复购率（小数）
  expected_path:
  - plan
  - get_schema
  - text2sql
  - validate_sql
  - run_query
  - report
  notes: §5.2：首单（paid 口径、全时段取 MIN）落在 [2026-05-01, 2026-06-01) 的用户为新客； 30 日内（fp, fp+30d] 有第二单即复购；复购率 =
    复购新客 ÷新客数。
- id: cmp001
  question: 2026 年 6 月全场 GMV 环比 5 月变化了多少
  type: compare
  standard_sql: |
    WITH m AS (
      SELECT (SUM(oi.unit_price * oi.quantity)
              FILTER (WHERE o.paid_at >= DATE '2026-06-01' AND o.paid_at < DATE '2026-07-01'))::float AS cur,
             (SUM(oi.unit_price * oi.quantity)
              FILTER (WHERE o.paid_at >= DATE '2026-05-01' AND o.paid_at < DATE '2026-06-01'))::float AS prev
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status IN ('paid', 'shipped', 'completed')
        AND o.paid_at >= DATE '2026-05-01' AND o.paid_at < DATE '2026-07-01')
    SELECT ((cur - prev) / prev)::float AS change_rate, cur, prev FROM m
  expected:
    value: -0.087125
    direction: down
    extras:
      cur: 6650712.33
      prev: 7285455.96
    tolerance: 0.02
  value_desc: 6 月全场 GMV 环比变化率（小数，负=下滑）
  expected_path:
  - plan
  - get_schema
  - text2sql
  - validate_sql
  - run_query
  - report
  notes: 环比 = (6月−5月)÷5月；两窗 [06-01,07-01) 与 [05-01,06-01)。
